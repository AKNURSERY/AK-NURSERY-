<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A.K Nursery Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f3;
  color:#12351f;
}

.container{
  width:min(1000px,94%);
  margin:30px auto;
}

.header{
  background:#064b2a;
  color:white;
  padding:20px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header h1{
  margin:0;
  font-size:24px;
}

button{
  border:0;
  cursor:pointer;
}

.btn{
  background:#087c35;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  font-weight:bold;
}

.btn:hover{
  background:#065f29;
}

.logout{
  background:#fff;
  color:#064b2a;
}

.card{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 15px #0001;
}

.login{
  max-width:450px;
  margin:80px auto;
}

h2{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccd8cd;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

label{
  font-weight:bold;
  font-size:14px;
}

.product{
  border:1px solid #dde6dd;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  display:flex;
  gap:15px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:contain;
  background:#f5f8f4;
  border-radius:8px;
}

.productInfo{
  flex:1;
}

.productInfo h3{
  margin:0 0 6px;
}

.productInfo p{
  margin:4px 0;
  color:#66756b;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.edit{
  background:#eaf6e9;
  color:#087c35;
}

.delete{
  background:#ffe9e9;
  color:#b00020;
}

.stock{
  margin:10px 0;
}

.hidden{
  display:none;
}

.message{
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  background:#eef8e9;
}

.preview{
  width:120px;
  height:120px;
  object-fit:contain;
  background:#f5f8f4;
  border-radius:10px;
  display:block;
  margin:10px 0;
}

@media(max-width:600px){

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .product{
    align-items:flex-start;
    flex-direction:column;
  }

  .product img{
    width:120px;
    height:120px;
  }

  .actions{
    width:100%;
  }
}
</style>
</head>

<body>

<div id="loginBox" class="container login">

  <div class="card">

    <h2>🔐 A.K Nursery Admin</h2>

    <p>Admin account se login karein.</p>

    <form id="loginForm">

      <label>Email</label>
      <input
        id="email"
        type="email"
        required
        placeholder="Admin email">

      <label>Password</label>
      <input
        id="password"
        type="password"
        required
        placeholder="Password">

      <button class="btn" type="submit">
        Login
      </button>

    </form>

    <div id="loginMessage"></div>

  </div>

</div>


<div id="adminBox" class="container hidden">

  <div class="header">

    <div>
      <h1>🌱 A.K Nursery Admin</h1>
      <small>Product Management</small>
    </div>

    <button
      class="btn logout"
      onclick="logout()">
      Logout
    </button>

  </div>


  <!-- ADD / EDIT PRODUCT -->

  <div class="card">

    <h2 id="formTitle">
      ➕ Add New Product
    </h2>

    <form id="productForm">

      <input
        id="productId"
        type="hidden">


      <label>Product Name</label>

      <input
        id="productName"
        required
        placeholder="Example: Plastic Pot 15&quot;">


      <label>Price ₹</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        required
        placeholder="419">


      <label>Old Price ₹</label>

      <input
        id="oldPrice"
        type="number"
        min="0"
        placeholder="499">


      <label>Category</label>

      <select id="productCat">

        <option value="Plants">
          Plants
        </option>

        <option value="Pots">
          Pots
        </option>

        <option value="Vermicompost">
          Vermicompost
        </option>

        <option value="Wall Compound">
          Wall Compound
        </option>

      </select>


      <label>Photo URL</label>

      <input
        id="imageUrl"
        type="url"
        placeholder="https://...">


      <img
        id="preview"
        class="preview hidden"
        alt="Photo preview">


      <label>Description</label>

      <textarea
        id="description"
        placeholder="Product description"></textarea>


      <label>Colors</label>

      <input
        id="colors"
        placeholder="Black, White, Green">


      <label class="stock">
        <input
          id="stock"
          type="checkbox"
          checked
          style="width:auto;">
        Product In Stock
      </label>


      <button
        class="btn"
        type="submit">
        💾 Save Product
      </button>

      <button
        type="button"
        class="btn edit hidden"
        id="cancelBtn"
        onclick="cancelEdit()">
        Cancel Edit
      </button>

    </form>

    <div id="formMessage"></div>

  </div>


  <!-- PRODUCT LIST -->

  <div class="card">

    <h2>📦 Your Products</h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://mudpcroftnctbbdqxisj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YaAB-Uf3OpSI5gpKdmqvSQ_TwHTtyLs";


const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};


let currentProducts = [];


// ======================================
// LOGIN
// ======================================

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  const message =
    document.getElementById("loginMessage");

  message.innerHTML =
    "Logging in...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      message.innerHTML =
        "❌ Login failed: " +
        (data.error_description ||
         data.msg ||
         "Invalid login");

      return;
    }


    localStorage.setItem(
      "ak_access_token",
      data.access_token
    );


    localStorage.setItem(
      "ak_user_id",
      data.user?.id || ""
    );


    showAdmin();

  }catch(error){

    console.error(error);

    message.innerHTML =
      "❌ Internet/Supabase connection problem.";

  }

});


// ======================================
// CHECK LOGIN
// ======================================

function checkLogin(){

  const token =
    localStorage.getItem(
      "ak_access_token"
    );

  if(token){

    showAdmin();

  }

}


// ======================================
// SHOW ADMIN
// ======================================

function showAdmin(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.remove("hidden");

  loadProducts();

}


// ======================================
// LOGOUT
// ======================================

async function logout(){

  const token =
    localStorage.getItem(
      "ak_access_token"
    );


  if(token){

    try{

      await fetch(
        SUPABASE_URL +
        "/auth/v1/logout",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + token
          }
        }
      );

    }catch(e){}

  }


  localStorage.removeItem(
    "ak_access_token"
  );

  localStorage.removeItem(
    "ak_user_id"
  );


  location.reload();

}


// ======================================
// LOAD PRODUCTS
// ======================================

async function loadProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML =
    "Loading products...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",
        {
          headers:headers
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      box.innerHTML =
        "❌ Products load nahi ho rahe.";

      console.error(data);

      return;
    }


    currentProducts = data;

    renderAdminProducts();

  }catch(error){

    console.error(error);

    box.innerHTML =
      "❌ Connection error.";

  }

}


// ======================================
// SHOW PRODUCTS
// ======================================

function renderAdminProducts(){

  const box =
    document.getElementById("products");


  if(!currentProducts.length){

    box.innerHTML =
      "<p>No products found.</p>";

    return;
  }


  box.innerHTML =
    currentProducts.map(p => `

      <div class="product">

        ${
          p.image_url
          ?
          `<img
            src="${escapeHTML(p.image_url)}"
            alt="${escapeHTML(p.name || "Product")}"
            onerror="this.style.display='none';"
          >`
          :
          `<img
            src=""
            alt="No photo"
            style="display:none;">
          `
        }


        <div class="productInfo">

          <h3>
            ${escapeHTML(
              p.name || "Product"
            )}
          </h3>

          <p>
            Category:
            ${escapeHTML(
              p.cat || "Plants"
            )}
          </p>

          <p>
            Price:
            ₹${Number(p.price) || 0}
          </p>

          <p>
            ${
              p.stock !== false
              ? "🟢 In Stock"
              : "🔴 Out of Stock"
            }
          </p>

        </div>


        <div class="actions">

          <button
            class="btn edit"
            onclick="editProduct(${p.id})">
            ✏️ Edit
          </button>

          <button
            class="btn delete"
            onclick="deleteProduct(${p.id})">
            🗑️ Delete
          </button>

        </div>

      </div>

    `).join("");

}


// ======================================
// ADD / UPDATE
// ======================================

document
.getElementById("productForm")
.addEventListener("submit", async function(e){

  e.preventDefault();


  const id =
    document.getElementById("productId").value;


  const name =
    document.getElementById("productName")
      .value.trim();


  const price =
    Number(
      document.getElementById("productPrice")
        .value
    );


  const oldPrice =
    Number(
      document.getElementById("oldPrice")
        .value
    ) || 0;


  const cat =
    document.getElementById("productCat")
      .value;


  const imageUrl =
    document.getElementById("imageUrl")
      .value.trim();


  const description =
    document.getElementById("description")
      .value.trim();


  const colors =
    document.getElementById("colors")
      .value.trim();


  const stock =
    document.getElementById("stock")
      .checked;


  const payload = {

    name:name,

    price:price,

    old_price:oldPrice,

    cat:cat,

    image_url:imageUrl,

    description:description,

    colors:colors,

    stock:stock

  };


  const message =
    document.getElementById("formMessage");


  message.innerHTML =
    "Saving...";


  try{

    let response;


    if(id){

      response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          encodeURIComponent(id),
          {
            method:"PATCH",
            headers:{
              ...headers,
              "Prefer":"return=minimal"
            },
            body:JSON.stringify(payload)
          }
        );

    }else{

      response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products",
          {
            method:"POST",
            headers:{
              ...headers,
              "Prefer":"return=minimal"
            },
            body:JSON.stringify(payload)
          }
        );

    }


    if(!response.ok){

      const error =
        await response.json();

      console.error(error);

      message.innerHTML =
        "❌ Save failed. Supabase RLS policy check karo.";

      return;
    }


    message.innerHTML =
      "✅ Product saved successfully.";


    resetForm();

    loadProducts();


  }catch(error){

    console.error(error);

    message.innerHTML =
      "❌ Connection error.";

  }

});


// ======================================
// EDIT PRODUCT
// ======================================

function editProduct(id){

  const p =
    currentProducts.find(
      x => x.id === id
    );


  if(!p) return;


  document.getElementById("productId")
    .value = p.id;


  document.getElementById("productName")
    .value = p.name || "";


  document.getElementById("productPrice")
    .value = p.price || 0;


  document.getElementById("oldPrice")
    .value = p.old_price || 0;


  document.getElementById("productCat")
    .value = p.cat || "Plants";


  document.getElementById("imageUrl")
    .value = p.image_url || "";


  document.getElementById("description")
    .value = p.description || "";


  document.getElementById("colors")
    .value =
      Array.isArray(p.colors)
      ? p.colors.join(", ")
      : (p.colors || "");


  document.getElementById("stock")
    .checked = p.stock !== false;


  document.getElementById("formTitle")
    .textContent =
      "✏️ Edit Product";


  document.getElementById("cancelBtn")
    .classList.remove("hidden");


  updatePreview();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


// ======================================
// DELETE
// ======================================

async function deleteProduct(id){

  const p =
    currentProducts.find(
      x => x.id === id
    );


  if(!p) return;


  const ok =
    confirm(
      `Delete "${p.name}"?`
    );


  if(!ok) return;


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        encodeURIComponent(id),
        {
          method:"DELETE",
          headers:{
            ...headers,
            "Prefer":"return=minimal"
          }
        }
      );


    if(!response.ok){

      const error =
        await response.json();

      console.error(error);

      alert(
        "Delete failed. Supabase RLS policy check karo."
      );

      return;
    }


    alert(
      "Product deleted."
    );


    loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "Connection error."
    );

  }

}


// ======================================
// IMAGE PREVIEW
// ======================================

document
.getElementById("imageUrl")
.addEventListener(
  "input",
  updatePreview
);


function updatePreview(){

  const url =
    document.getElementById("imageUrl")
      .value.trim();


  const preview =
    document.getElementById("preview");


  if(url){

    preview.src = url;

    preview.classList.remove(
      "hidden"
    );

  }else{

    preview.src = "";

    preview.classList.add(
      "hidden"
    );

  }

}


// ======================================
// RESET FORM
// ======================================

function resetForm(){

  document
    .getElementById("productForm")
    .reset();


  document.getElementById("productId")
    .value = "";


  document.getElementById("stock")
    .checked = true;


  document.getElementById("formTitle")
    .textContent =
      "➕ Add New Product";


  document.getElementById("cancelBtn")
    .classList.add("hidden");


  document.getElementById("preview")
    .classList.add("hidden");

}


function cancelEdit(){

  resetForm();

}


// ======================================
// ESCAPE HTML
// ======================================

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ======================================
// START
// ======================================

checkLogin();

</script>

</body>
</html>
