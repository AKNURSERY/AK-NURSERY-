<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A.K Nursery Admin</title>

<style>

*{
 box-sizing:border-box;
}

body{
 font-family:Arial,sans-serif;
 background:#f4f7f4;
 margin:0;
 padding:20px;
 color:#12351f;
}

.container{
 max-width:650px;
 margin:auto;
}

h1{
 color:#176b35;
}

.box{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:20px;
 box-shadow:0 3px 12px #0000000d;
}

input,
textarea,
select{
 width:100%;
 box-sizing:border-box;
 padding:12px;
 margin:7px 0 14px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:15px;
}

textarea{
 min-height:100px;
 resize:vertical;
}

button{
 padding:10px 14px;
 border:0;
 border-radius:8px;
 background:#176b35;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin:3px;
}

button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

.danger{
 background:#c62828;
}

.editBtn{
 background:#1976d2;
}

.stockBtn{
 background:#ef8f00;
}

.cancelBtn{
 background:#777;
}

.product{
 border:1px solid #ddd;
 padding:12px;
 border-radius:10px;
 margin:10px 0;
}

.product img{
 width:110px;
 height:110px;
 object-fit:cover;
 border-radius:8px;
 display:block;
 margin-bottom:10px;
}

.preview{
 width:150px;
 height:150px;
 object-fit:cover;
 border-radius:10px;
 display:none;
 margin:10px 0;
}

.hidden{
 display:none;
}

.error{
 color:#c62828;
 word-break:break-word;
}

.success{
 color:green;
 font-weight:bold;
}

.uploadBtn{
 display:inline-block;
 background:#176b35;
 color:white;
 padding:12px 18px;
 border-radius:8px;
 cursor:pointer;
 margin:5px 0 10px;
}

.small{
 font-size:13px;
 color:#666;
}

.out{
 color:#c62828;
 font-weight:bold;
}

.in{
 color:green;
 font-weight:bold;
}

.price{
 font-size:18px;
 font-weight:bold;
 color:#087c35;
}

.old{
 text-decoration:line-through;
 color:#999;
 font-size:13px;
 margin-left:6px;
}

.loading{
 color:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>🌱 A.K Nursery Admin</h1>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div id="loginBox" class="box">

<h2>🔐 Admin Login</h2>

<input
 id="email"
 type="email"
 placeholder="Admin Email"
 autocomplete="email"
>

<input
 id="password"
 type="password"
 placeholder="Password"
 autocomplete="current-password"
>

<button onclick="login()">
 Login
</button>

<p id="loginMsg"></p>

</div>


<!-- ========================= -->
<!-- ADMIN PANEL -->
<!-- ========================= -->

<div id="adminBox" class="hidden">


<!-- ========================= -->
<!-- ADD / EDIT PRODUCT -->
<!-- ========================= -->

<div class="box">

<h2 id="formTitle">
➕ Add Product
</h2>


<input
 id="productName"
 placeholder="Product name"
>


<select id="category">

<option value="Plants">
🌿 Plants
</option>

<option value="Pots">
🪴 Pots
</option>

<option value="Vermicompost">
♻️ Vermicompost
</option>

<option value="Wall Compound">
🧱 Wall Compound
</option>

</select>


<input
 id="price"
 type="number"
 min="0"
 placeholder="Selling Price"
>


<input
 id="oldPrice"
 type="number"
 min
