<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.K Nursery Admin</title>

<style>
*{box-sizing:border-box}

body{
 font-family:Arial,sans-serif;
 background:#f4f7f4;
 margin:0;
 padding:20px;
 color:#12351f
}

.container{
 max-width:650px;
 margin:auto
}

h1{
 color:#176b35;
 text-align:center
}

.box{
 background:white;
 padding:20px;
 border-radius:14px;
 margin-bottom:20px;
 box-shadow:0 2px 10px #0001
}

input,textarea,select{
 width:100%;
 padding:12px;
 margin:7px 0 14px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:15px
}

textarea{
 min-height:100px;
 resize:vertical
}

button{
 padding:11px 15px;
 border:0;
 border-radius:8px;
 background:#176b35;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin:3px
}

button:disabled{
 background:#999;
 cursor:not-allowed
}

.danger{background:#c62828}
.editBtn{background:#1976d2}
.stockBtn{background:#ef8f00}
.cancelBtn{background:#777}
.deleteBtn{background:#c62828}

.hidden{
 display:none
}

.uploadBtn{
 display:block;
 background:#176b35;
 color:white;
 padding:13px;
 border-radius:8px;
 text-align:center;
 cursor:pointer;
 margin-bottom:8px
}

.photosPreview{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:8px;
 margin:10px 0
}

.photoBox{
 position:relative
}

.photoBox img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 border-radius:8px;
 border:1px solid #ddd
}

.removePhoto{
 position:absolute;
 top:2px;
 right:2px;
 width:25px;
 height:25px;
 padding:0;
 border-radius:50%;
 background:#c62828;
 font-size:14px
}

.colorList{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin:5px 0 15px
}

.colorItem{
 background:#eef6ed;
 border:1px solid #cddfce;
 padding:7px 10px;
 border-radius:20px;
 display:flex;
 align-items:center;
 gap:5px
}

.colorItem button{
 background:#c62828;
 padding:3px 7px;
 margin:0;
 border-radius:50%
}

.product{
 border:1px solid #ddd;
 padding:14px;
 border-radius:12px;
 margin:12px 0
}

.productPhotos{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 margin-bottom:10px
}

.productPhotos img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 border-radius:6px
}

.product h3{
 margin:8px 0
}

.price{
 color:#176b35;
 font-size:20px;
 font-weight:bold
}

.old{
 color:#999;
 text-decoration:line-through;
 font-size:14px;
 margin-left:6px
}

.colors{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin:8px 0
}

.colorBadge{
 background:#f0f0f0;
 padding:5px 9px;
 border-radius:15px;
 font-size:13px
}

.in{
 color:green;
 font-weight:bold
}

.out{
 color:#c62828;
 font-weight:bold
}

.success{
 color:green;
 font-weight:bold
}

.error{
 color:#c62828;
 word-break:break-word
}

.small{
 font-size:13px;
 color:#666
}

.chargeRow{
 display:grid;
 grid-template-columns:1fr 150px;
 gap:10px;
 align-items:center
}

@media(max-width:500px){
 .photosPreview,
 .productPhotos{
  grid-template-columns:repeat(5,1fr)
 }

 .chargeRow{
  grid-template-columns:1fr 110px
 }
}
</style>
</head>

<body>

<div class="container">

<h1>🌱 A.K Nursery Admin</h1>

<!-- ================= LOGIN ================= -->

<div id="loginBox" class="box">

<h2>🔐 Admin Login</h2>

<input
 id="email"
 type="email"
 placeholder="Admin Email"
>

<input
 id="password"
 type="password"
 placeholder="Password"
>

<button onclick="login()">Login</button>

<p id="loginMsg"></p>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminBox" class="hidden">

<!-- PRODUCT FORM -->

<div class="box">

<h2 id="formTitle">➕ Add Product</h2>

<label>Product Name</label>

<input
 id="productName"
 placeholder="Example: Money Plant"
>

<label>Category</label>

<select id="category">

<option value="Plants">🌿 Plants</option>

<option value="Pots">🪴 Pots</option>

<option value="Vermicompost">♻️ Vermicompost</option>

<option value="Wall Compound">🧱 Wall Compound</option>

</select>


<label>Current Price</label>

<input
 id="price"
 type="number"
 min="0"
 placeholder="Price"
>


<label>Old Price</label>

<input
 id="oldPrice"
 type="number"
 min="0"
 placeholder="Old Price (optional)"
>


<!-- COLORS -->

<label>🎨 Product Colors</label>

<input
 id="colorInput"
 placeholder="Example: Red"
>

<button
 type="button"
 onclick="addColor()"
>
➕ Add Color
</button>

<p class="small">
Maximum 10 colors per product.
</p>

<div id="colorList" class="colorList"></div>


<!-- PHOTOS -->

<label>📸 Product Photos</label>

<label class="uploadBtn">

Choose Photos From Gallery

<input
 id="productPhoto"
 type="file"
 accept="image/*"
 multiple
 hidden
 onchange="previewPhotos(event)"
>

</label>

<p class="small">
Maximum 10 photos per product.
</p>

<div
 id="photosPreview"
 class="photosPreview"
></div>


<label>Description</label>

<textarea
 id="description"
 placeholder="Product description"
></textarea>


<button
 id="saveBtn"
 onclick="saveProduct()"
>
➕ Add Product
</button>

<button
 id="cancelBtn"
 class="cancelBtn hidden"
 onclick="cancelEdit()"
>
Cancel Edit
</button>

<p id="msg"></p>

</div>


<!-- ================= CHARGES ================= -->

<div class="box">

<h2>💰 Delivery & Fixing Charges</h2>

<div class="chargeRow">

<label>🚚 Delivery Charge</label>

<input
 id="deliveryCharge"
 type="number"
 min="0"
 placeholder="₹"
>

</div>


<div class="chargeRow">

<label>🪴 Pot Fixing Charge</label>

<input
 id="potFixingCharge"
 type="number"
 min="0"
 placeholder="₹"
>

</div>


<div class="chargeRow">

<label>🌱 Plant Fixing Charge</label>

<input
 id="plantFixingCharge"
 type="number"
 min="0"
 placeholder="₹"
>

</div>


<button onclick="saveCharges()">
💾 Save Charges
</button>

<p id="chargeMsg"></p>

</div>


<!-- ================= PRODUCTS ================= -->

<div class="box">

<h2>📦 Products</h2>

<div id="productList">
Loading...
</div>

</div>


<button
 class="danger"
 onclick="logout()"
>
Logout
</button>

</div>

</div>


<script>

/* ==================================================
   A.K NURSERY ADMIN
   ================================================== */

const SUPABASE_URL =
"https://mudpcroftnctbbdqxisj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YaAB-Uf3OpSI5gpKdmqvSQ_TwHTtyLs";

const BUCKET =
"product-images";


let editingId = null;

let selectedColors = [];

let selectedFiles = [];

let existingImages = [];

let products = [];


/* ==================================================
   LOGIN
   ================================================== */

async function login(){

 const email =
 document.getElementById("email").value.trim();

 const password =
 document.getElementById("password").value;

 const msg =
 document.getElementById("loginMsg");

 msg.textContent="⏳ Login...";

 try{

  const r = await fetch(
   SUPABASE_URL +
   "/auth/v1/token?grant_type=password",
   {
    method:"POST",
    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     email:email,
     password:password
    })
   }
  );

  const data = await r.json();

  if(data.access_token){

   localStorage.setItem(
    "ak_token",
    data.access_token
   );

   document
   .getElementById("loginBox")
   .classList.add("hidden");

   document
   .getElementById("adminBox")
   .classList.remove("hidden");

   loadProducts();

   loadCharges();

  }else{

   msg.innerHTML =
   `<span class="error">
   Login failed: ${
    data.error_description ||
    data.msg ||
    "Email/password check karo."
   }
   </span>`;

  }

 }catch(error){

  msg.innerHTML =
  `<span class="error">
  Network error.
  </span>`;

 }

}


/* ==================================================
   PHOTO PREVIEW
   ================================================== */

function previewPhotos(event){

 const files =
 Array.from(event.target.files);

 if(files.length > 10){

  alert("Maximum 10 photos allowed.");

  event.target.value="";

  return;
 }

 selectedFiles = files;

 renderPhotoPreview();

}


function renderPhotoPreview(){

 const box =
 document.getElementById("photosPreview");

 box.innerHTML="";

 selectedFiles.forEach(
  (file,index)=>{

   const url =
   URL.createObjectURL(file);

   box.innerHTML += `

    <div class="photoBox">

     <img src="${url}">

     <button
      class="removePhoto"
      onclick="removeSelectedPhoto(${index})"
      type="button"
     >
      ×
     </button>

    </div>

   `;

  }
 );

}


function removeSelectedPhoto(index){

 selectedFiles.splice(index,1);

 renderPhotoPreview();

}


/* ==================================================
   COLORS
   ================================================== */

function addColor(){

 const input =
 document.getElementById("colorInput");

 const color =
 input.value.trim();

 if(!color) return;

 if(selectedColors.length >= 10){

  alert("Maximum 10 colors allowed.");

  return;
 }

 if(
  selectedColors
  .some(
   c => c.toLowerCase() === color.toLowerCase()
  )
 ){

  alert("Ye color already added hai.");

  return;
 }

 selectedColors.push(color);

 input.value="";

 renderColors();

}


function renderColors(){

 const box =
 document.getElementById("colorList");

 box.innerHTML =
 selectedColors.map(
  (color,index)=>`

   <div class="colorItem">

    ${escapeHTML(color)}

    <button
     type="button"
     onclick="removeColor(${index})"
    >
     ×
    </button>

   </div>

  `
 ).join("");

}


function removeColor(index){

 selectedColors.splice(index,1);

 renderColors();

}


/* ==================================================
   UPLOAD PHOTO
   ================================================== */

async function uploadPhoto(file){

 const token =
 localStorage.getItem("ak_token");

 if(!token){

  throw new Error(
   "Admin login required."
  );

 }

 const extension =
 file.name
 .split(".")
 .pop()
 .toLowerCase();

 const fileName =
 Date.now() +
 "_" +
 Math.random()
 .toString(36)
 .substring(2,10) +
 "." +
 extension;

 const uploadUrl =
 SUPABASE_URL +
 "/storage/v1/object/" +
 BUCKET +
 "/" +
 fileName;

 const r =
 await fetch(
  uploadUrl,
  {
   method:"POST",

   headers:{
    "apikey":SUPABASE_KEY,

    "Authorization":
     "Bearer " + token,

    "Content-Type":
     file.type,

    "x-upsert":
     "false"
   },

   body:file
  }
 );

 if(!r.ok){

  const error =
  await r.text();

  throw new Error(
   "Photo upload failed: " +
   error
  );

 }

 return (
  SUPABASE_URL +
  "/storage/v1/object/public/" +
  BUCKET +
  "/" +
  fileName
 );

}


/* ==================================================
   SAVE PRODUCT
   ================================================== */

async function saveProduct(){

 const msg =
 document.getElementById("msg");

 try{

  msg.innerHTML="⏳ Saving...";

  const token =
  localStorage.getItem("ak_token");

  if(!token){

   msg.innerHTML =
   `<span class="error">
   Please login first.
   </span>`;

   return;
  }


  const name =
  document
  .getElementById("productName")
  .value.trim();


  const cat =
  document
  .getElementById("category")
  .value;


  const price =
  Number(
   document
   .getElementById("price")
   .value
  );


  const oldPrice =
  Number(
   document
   .getElementById("oldPrice")
   .value
  ) || 0;


  const description =
  document
  .getElementById("description")
  .value.trim();


  if(!name){

   msg.innerHTML =
   `<span class="error">
   Product name डालो.
   </span>`;

   return;
  }


  if(price <= 0){

   msg.innerHTML =
   `<span class="error">
   Valid price डालो.
   </span>`;

   return;
  }


  if(oldPrice > 0 && oldPrice <= price){

   msg.innerHTML =
   `<span class="error">
   Old Price current price se zyada hona chahiye.
   </span>`;

   return;
  }


  /* ============================
     EDIT PRODUCT
     ============================ */

  if(editingId){

   let updateData = {

    name:name,

    cat:cat,

    price:price,

    old_price:oldPrice,

    colors:selectedColors,

    description:description

   };


   /* New photos upload */

   if(selectedFiles.length){

    msg.innerHTML =
    "📸 Photos upload ho rahi hain...";

    const newImages = [];

    for(
     const file of selectedFiles
    ){

     const url =
     await uploadPhoto(file);

     newImages.push(url);

    }


    updateData.images =
    [
     ...existingImages,
     ...newImages
    ].slice(0,10);


    updateData.image_url =
    updateData.images[0] || "";

   }


   msg.innerHTML =
   "⏳ Product update ho raha hai...";


   const r =
   await fetch(
    SUPABASE_URL +
    "/rest/v1/products?id=eq." +
    editingId,
    {
     method:"PATCH",

     headers:{
      "apikey":SUPABASE_KEY,

      "Authorization":
       "Bearer " + token,

      "Content-Type":
       "application/json",

      "Prefer":
       "return=minimal"
     },

     body:
     JSON.stringify(updateData)
    }
   );


   if(!r.ok){

    const error =
    await r.text();

    msg.innerHTML =
    `<span class="error">
    Update failed:<br>
    ${error}
    </span>`;

    return;
   }


   msg.innerHTML =
   `<span class="success">
   ✅ Product updated successfully!
   </span>`;


   cancelEdit();

   loadProducts();

   return;

  }


  /* ============================
     NEW PRODUCT
     ============================ */

  let imageUrls = [];


  if(selectedFiles.length){

   msg.innerHTML =
   "📸 Photos upload ho rahi hain...";


   for(
    const file of selectedFiles
   ){

    const url =
    await uploadPhoto(file);

    imageUrls.push(url);

   }

  }


  const product = {

   name:name,

   cat:cat,

   price:price,

   old_price:oldPrice,

   colors:selectedColors,

   images:imageUrls,

   image_url:
    imageUrls[0] || "",

   description:description,

   stock:true

  };


  msg.innerHTML =
  "⏳ Product save ho raha hai...";


  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/products",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,

     "Authorization":
      "Bearer " + token,

     "Content-Type":
      "application/json",

     "Prefer":
      "return=minimal"
    },

    body:
    JSON.stringify(product)
   }
  );


  if(!r.ok){

   const error =
   await r.text();

   msg.innerHTML =
   `<span class="error">
   Product add nahi hua:<br>
   ${error}
   </span>`;

   return;
  }


  msg.innerHTML =
  `<span class="success">
  ✅ Product added successfully!
  </span>`;


  clearForm();

  loadProducts();


 }catch(error){

  msg.innerHTML =
  `<span class="error">
  ❌ ${error.message}
  </span>`;

 }

}


/* ==================================================
   LOAD PRODUCTS
   ================================================== */

async function loadProducts(){

 const token =
 localStorage.getItem("ak_token");

 if(!token) return;


 try{

  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/products?select=*&order=id.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,

     "Authorization":
      "Bearer " + token
    }
   }
  );


  const data =
  await r.json();


  if(!r.ok){

   document
   .getElementById("productList")
   .innerHTML =
   `<p class="error">
   ${escapeHTML(JSON.stringify(data))}
   </p>`;

   return;
  }


  products=data;

  renderProducts(data);


 }catch(error){

  document
  .getElementById("productList")
  .innerHTML =
  `<p class="error">
  ${error.message}
  </p>`;

 }

}


/* ==================================================
   RENDER PRODUCTS
   ================================================== */

function renderProducts(data){

 const list =
 document.getElementById("productList");


 if(!data.length){

  list.innerHTML =
  "<p>No products added yet.</p>";

  return;
 }


 list.innerHTML =
 data.map(
  p=>{

   const images =
   Array.isArray(p.images) &&
   p.images.length

   ?

   p.images

   :

   (
    p.image_url
    ?
    [p.image_url]
    :
    []
   );


   const colors =
   Array.isArray(p.colors)
   ?
   p.colors
   :
   [];


   return `

    <div class="product">

     ${
      images.length

      ?

      `
      <div class="productPhotos">

       ${
        images
        .slice(0,10)
        .map(
         img=>`
          <img
           src="${escapeHTML(img)}"
          >
         `
        )
        .join("")
       }

      </div>
      `

      :

      ""
     }


     <h3>
      ${escapeHTML(p.name)}
     </h3>


     <p>
      Category:
      <b>${escapeHTML(p.cat)}</b>
     </p>


     <div class="price">

      ₹${Number(p.price)||0}

      ${
       Number(p.old_price)>0

       ?

       `
       <span class="old">
        ₹${Number(p.old_price)}
       </span>
       `

       :

       ""
      }

     </div>


     ${
      colors.length

      ?

      `
      <div class="colors">

       ${colors.map(
        c=>`
         <span class="colorBadge">
          🎨 ${escapeHTML(c)}
         </span>
        `
       ).join("")}

      </div>
      `

      :

      ""
     }


     ${
      p.description

      ?

      `<p>${escapeHTML(p.description)}</p>`

      :

      ""
     }


     <p>
      Stock:

      ${
       p.stock !== false

       ?

       `
       <span class="in">
        Available ✅
       </span>
       `

       :

       `
       <span class="out">
        Out of Stock ❌
       </span>
       `
      }

     </p>


     <button
      class="editBtn"
      onclick="editProduct(${p.id})"
     >
      ✏️ Edit
     </button>


     <button
      class="stockBtn"
      onclick="toggleStock(
       ${p.id},
       ${p.stock !== false}
      )"
     >

      ${
       p.stock !== false

       ?

       "📦 Mark Out of Stock"

       :

       "✅ Mark Available"
      }

     </button>


     <button
      class="deleteBtn"
      onclick="deleteProduct(${p.id})"
     >
      🗑️ Delete
     </button>

    </div>

   `;

  }
 ).join("");

}


/* ==================================================
   EDIT PRODUCT
   ================================================== */

async function editProduct(id){

 const token =
 localStorage.getItem("ak_token");


 try{

  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/products?id=eq." +
   id +
   "&select=*",
   {
    headers:{
     "apikey":SUPABASE_KEY,

     "Authorization":
      "Bearer " + token
    }
   }
  );


  const data =
  await r.json();


  if(!r.ok || !data.length){

   alert("Product load nahi hua.");

   return;
  }


  const p=data[0];

  editingId=id;


  document
  .getElementById("formTitle")
  .textContent =
  "✏️ Edit Product";


  document
  .getElementById("productName")
  .value =
  p.name || "";


  document
  .getElementById("category")
  .value =
  p.cat || "Plants";


  document
  .getElementById("price")
  .value =
  p.price || "";


  document
  .getElementById("oldPrice")
  .value =
  p.old_price || "";


  document
  .getElementById("description")
  .value =
  p.description || "";


  selectedColors =
  Array.isArray(p.colors)
  ?
  [...p.colors].slice(0,10)
  :
  [];


  renderColors();


  existingImages =
  Array.isArray(p.images)
  ?
  [...p.images].slice(0,10)
  :
  (
   p.image_url
   ?
   [p.image_url]
   :
   []
  );


  selectedFiles=[];

  document
  .getElementById("productPhoto")
  .value="";


  renderExistingPhotos();


  document
  .getElementById("saveBtn")
  .textContent =
  "💾 Update Product";


  document
  .getElementById("cancelBtn")
  .classList
  .remove("hidden");


  window.scrollTo({
   top:0,
   behavior:"smooth"
  });


 }catch(error){

  alert(
   "Error: " +
   error.message
  );

 }

}


/* ==================================================
   EXISTING PHOTO DISPLAY
   ================================================== */

function renderExistingPhotos(){

 const box =
 document.getElementById("photosPreview");

 box.innerHTML="";


 existingImages.forEach(
  (url,index)=>{

   box.innerHTML += `

    <div class="photoBox">

     <img src="${escapeHTML(url)}">

     <button
      type="button"
      class="removePhoto"
      onclick="removeExistingPhoto(${index})"
     >
      ×
     </button>

    </div>

   `;

  }
 );

}


/* ==================================================
   REMOVE EXISTING PHOTO
   ================================================== */

function removeExistingPhoto(index){

 existingImages.splice(index,1);

 renderExistingPhotos();

}


/* ==================================================
   STOCK
   ================================================== */

async function toggleStock(
 id,
 currentStock
){

 const token =
 localStorage.getItem("ak_token");


 const r =
 await fetch(
  SUPABASE_URL +
  "/rest/v1/products?id=eq." +
  id,
  {
   method:"PATCH",

   headers:{
    "apikey":SUPABASE_KEY,

    "Authorization":
     "Bearer " + token,

    "Content-Type":
     "application/json",

    "Prefer":
     "return=minimal"
   },

   body:
   JSON.stringify({
    stock:!currentStock
   })
  }
 );


 if(r.ok){

  loadProducts();

 }else{

  const error =
  await r.text();

  alert(
   "Stock update nahi hua:\n" +
   error
  );

 }

}


/* ==================================================
   DELETE PRODUCT
   ================================================== */

async function deleteProduct(id){

 if(
  !confirm(
   "Kya aap ye product delete karna chahte ho?"
  )
 ){

  return;
 }


 const token =
 localStorage.getItem("ak_token");


 const r =
 await fetch(
  SUPABASE_URL +
  "/rest/v1/products?id=eq." +
  id,
  {
   method:"DELETE",

   headers:{
    "apikey":SUPABASE_KEY,

    "Authorization":
     "Bearer " + token,

    "Prefer":
     "return=minimal"
   }
  }
 );


 if(r.ok){

  alert("Product deleted successfully.");

  loadProducts();

 }else{

  const error =
  await r.text();

  alert(
   "Delete failed:\n" +
   error
  );

 }

}


/* ==================================================
   CHARGES
   ================================================== */

async function loadCharges(){

 const token =
 localStorage.getItem("ak_token");

 if(!token) return;


 try{

  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/shop_settings?id=eq.1&select=*",
   {
    headers:{
     "apikey":SUPABASE_KEY,

     "Authorization":
      "Bearer " + token
    }
   }
  );


  const data =
  await r.json();


  if(!r.ok || !data.length){

   return;
  }


  const settings=data[0];


  document
  .getElementById("deliveryCharge")
  .value =
  settings.delivery_charge || 0;


  document
  .getElementById("potFixingCharge")
  .value =
  settings.pot_fixing_charge || 0;


  document
  .getElementById("plantFixingCharge")
  .value =
  settings.plant_fixing_charge || 0;


 }catch(error){

  console.error(error);

 }

}


/* ==================================================
   SAVE CHARGES
   ================================================== */

async function saveCharges(){

 const token =
 localStorage.getItem("ak_token");

 const msg =
 document.getElementById("chargeMsg");


 const delivery =
 Number(
  document
  .getElementById("deliveryCharge")
  .value
 ) || 0;


 const pot =
 Number(
  document
  .getElementById("potFixingCharge")
  .value
 ) || 0;


 const plant =
 Number(
  document
  .getElementById("plantFixingCharge")
  .value
 ) || 0;


 msg.textContent =
 "⏳ Saving...";


 try{

  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/shop_settings?id=eq.1",
   {
    method:"PATCH",

    headers:{
     "apikey":SUPABASE_KEY,

     "Authorization":
      "Bearer " + token,

     "Content-Type":
      "application/json",

     "Prefer":
      "return=minimal"
    },

    body:
    JSON.stringify({

     delivery_charge:delivery,

     pot_fixing_charge:pot,

     plant_fixing_charge:plant,

     updated_at:
      new Date().toISOString()

    })
   }
  );


  if(!r.ok){

   const error =
   await r.text();

   msg.innerHTML =
   `<span class="error">
   ${escapeHTML(error)}
   </span>`;

   return;
  }


  msg.innerHTML =
  `<span class="success">
  ✅ Charges saved successfully!
  </span>`;


 }catch(error){

  msg.innerHTML =
  `<span class="error">
  ${error.message}
  </span>`;

 }

}

/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHTML(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
