<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.K Nursery Admin</title>
<
<style>
body{font-family:Arial,sans-serif;background:#f4f7f4;margin:0;padding:20px}
.container{max-width:600px;margin:auto}
h1{color:#176b35}
.box{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#176b35;color:white;font-weight:bold}
.danger{background:#c62828}
.product{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}
.product img{width:100px;height:100px;object-fit:cover;border-radius:8px}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<h1>🌱 A.K Nursery Admin</h1>

<div id="loginBox" class="box">
<h2>Admin Login</h2>

<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<div id="adminBox" class="hidden">

<div class="box">
<h2>Add Product</h2>

<input id="productName" placeholder="Product name">

<select id="category">
<option>Plants</option>
<option>Pots</option>
<option>Vermicompost</option>
<option>Wall Compound</option>
</select>

<input id="price" type="number" placeholder="Price">
<input id="oldPrice" type="number" placeholder="Old Price (optional)">

<input id="imageUrl" placeholder="Photo URL">

<textarea id="description" placeholder="Product description"></textarea>

<button onclick="addProduct()">Add Product</button>

<p id="msg"></p>
</div>

<div class="box">
<h2>Products</h2>
<div id="productList">Loading...</div>
</div>

<button class="danger" onclick="logout()">Logout</button>

</div>

<script>
const SUPABASE_URL = "https://mudpcroftnctbbdqxisj.supabase.co";
const SUPABASE_KEY = "sb_publishable_YaAB-Uf3OpSI5gpKdmqvSQ_TwHTtyLs";

async function login(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;

 const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
  method:"POST",
  headers:{
   "apikey":SUPABASE_KEY,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({email,password})
 });

 const data=await r.json();

 if(data.access_token){
  localStorage.setItem("ak_token",data.access_token);
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
  loadProducts();
 }else{
  document.getElementById("loginMsg").textContent="Login failed. Email/password check karo.";
 }
}

async function loadProducts(){
 const token=localStorage.getItem("ak_token");

 const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=*&order=id.desc",{
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+token
  }
 });

 const data=await r.json();

 document.getElementById("productList").innerHTML=data.map(p=>`
 <div class="product">
  ${p.image_url?`<img src="${p.image_url}">`:""}
  <h3>${p.name}</h3>
  <p>Category: ${p.cat || ""}</p>
  <b>₹${p.price}</b>
 </div>
 `).join("");
}

async function addProduct(){
 const token=localStorage.getItem("ak_token");

 const product={
  name:document.getElementById("productName").value,
  price:Number(document.getElementById("price").value),
  image_url:document.getElementById("imageUrl").value,
  description:document.getElementById("description").value,
  stock:true
 };

 const r=await fetch(SUPABASE_URL+"/rest/v1/products",{
  method:"POST",
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+token,
   "Content-Type":"application/json",
   "Prefer":"return=minimal"
  },
  body:JSON.stringify(product)
 });

 if(r.ok){
  document.getElementById("msg").textContent="Product added successfully ✅";
  loadProducts();
 }else{
  document.getElementById("msg").textContent="Product add nahi hua.";
 }
}

function logout(){
 localStorage.removeItem("ak_token");
 location.reload();
}

if(localStorage.getItem("ak_token")){
 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("adminBox").classList.remove("hidden");
 loadProducts();
}
</script>

</body>
</html>
