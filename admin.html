<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.K Nursery Admin</title>

<style>
body{
 font-family:Arial,sans-serif;
 background:#f4f7f4;
 margin:0;
 padding:20px
}
.container{max-width:600px;margin:auto}
h1{color:#176b35}
.box{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:20px
}
input,textarea,select{
 width:100%;
 box-sizing:border-box;
 padding:12px;
 margin:7px 0 14px;
 border:1px solid #ccc;
 border-radius:8px
}
button{
 padding:10px 14px;
 border:0;
 border-radius:8px;
 background:#176b35;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin:3px
}
.danger{background:#c62828}
.editBtn{background:#1976d2}
.stockBtn{background:#ef8f00}
.cancelBtn{background:#777}
.product{
 border:1px solid #ddd;
 padding:12px;
 border-radius:10px;
 margin:10px 0
}
.product img{
 width:100px;
 height:100px;
 object-fit:cover;
 border-radius:8px
}
.preview{
 width:150px;
 height:150px;
 object-fit:cover;
 border-radius:10px;
 display:none;
 margin:10px 0
}
.hidden{display:none}
.error{
 color:#c62828;
 word-break:break-word
}
.success{
 color:green;
 font-weight:bold
}
.uploadBtn{
 display:inline-block;
 background:#176b35;
 color:white;
 padding:12px 18px;
 border-radius:8px;
 cursor:pointer;
 margin:5px 0 10px
}
.small{
 font-size:13px;
 color:#666
}
.out{
 color:#c62828;
 font-weight:bold
}
.in{
 color:green;
 font-weight:bold
}
</style>
</head>

<body>

<div class="container">

<h1>🌱 A.K Nursery Admin</h1>

<!-- LOGIN -->

<div id="loginBox" class="box">

<h2>Admin Login</h2>

<input id="email" type="email" placeholder="Admin Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="loginMsg"></p>

</div>


<!-- ADMIN -->

<div id="adminBox" class="hidden">

<div class="box">

<h2 id="formTitle">➕ Add Product</h2>

<input id="productName" placeholder="Product name">

<select id="category">
<option value="Plants">Plants</option>
<option value="Pots">Pots</option>
<option value="Vermicompost">Vermicompost</option>
<option value="Wall Compound">Wall Compound</option>
</select>

<input id="price" type="number" placeholder="Price">

<input id="oldPrice" type="number" placeholder="Old Price (optional)">

<label class="uploadBtn">
📸 Choose Product Photo

<input
 id="productPhoto"
 type="file"
 accept="image/*"
 style="display:none"
 onchange="previewPhoto(event)"
>
</label>

<p class="small">
Phone gallery se photo select karo.
</p>

<img id="photoPreview" class="preview">

<textarea
 id="description"
 placeholder="Product description">
</textarea>

<button id="saveBtn" onclick="saveProduct()">
Add Product
</button>

<button
 id="cancelBtn"
 class="cancelBtn hidden"
 onclick="cancelEdit()">
Cancel Edit
</button>

<p id="msg"></p>

</div>


<!-- PRODUCTS -->

<div class="box">

<h2>📦 Products</h2>

<div id="productList">
Loading...
</div>

</div>


<button class="danger" onclick="logout()">
Logout
</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://mudpcroftnctbbdqxisj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YaAB-Uf3OpSI5gpKdmqvSQ_TwHTtyLs";

const BUCKET =
"product-images";

let editingId = null;


// =========================
// LOGIN
// =========================

async function login(){

 const email =
 document.getElementById("email").value.trim();

 const password =
 document.getElementById("password").value;

 try{

  const r = await fetch(
   SUPABASE_URL +
   "/auth/v1/token?grant_type=password",
   {
    method:"POST",
    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     email,
     password
    })
   }
  );

  const data = await r.json();

  if(data.access_token){

   localStorage.setItem(
    "ak_token",
    data.access_token
   );

   document
   .getElementById("loginBox")
   .classList.add("hidden");

   document
   .getElementById("adminBox")
   .classList.remove("hidden");

   loadProducts();

  }else{

   document
   .getElementById("loginMsg")
   .textContent =
   "Login failed: " +
   (
    data.error_description ||
    data.msg ||
    "Email/password check karo."
   );

  }

 }catch(error){

  document
  .getElementById("loginMsg")
  .textContent =
  "Network error.";

 }

}


// =========================
// PHOTO PREVIEW
// =========================

function previewPhoto(event){

 const file =
 event.target.files[0];

 const preview =
 document.getElementById("photoPreview");

 if(file){

  preview.src =
  URL.createObjectURL(file);

  preview.style.display =
  "block";

 }

}


// =========================
// UPLOAD PHOTO
// =========================

async function uploadPhoto(file){

 const token =
 localStorage.getItem("ak_token");

 if(!token){

  throw new Error(
   "Admin login required."
  );

 }

 const extension =
 file.name.split(".").pop()
 .toLowerCase();

 const fileName =
 Date.now() +
 "_" +
 Math.random()
 .toString(36)
 .substring(2,8) +
 "." +
 extension;

 const uploadUrl =
 SUPABASE_URL +
 "/storage/v1/object/" +
 BUCKET +
 "/" +
 fileName;

 const r =
 await fetch(uploadUrl,{
  method:"POST",
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":
    "Bearer " + token,
   "Content-Type":file.type,
   "x-upsert":"false"
  },
  body:file
 });

 if(!r.ok){

  const error =
  await r.text();

  throw new Error(
   "Photo upload failed: " +
   error
  );

 }

 return (
  SUPABASE_URL +
  "/storage/v1/object/public/" +
  BUCKET +
  "/" +
  fileName
 );

}


// =========================
// SAVE PRODUCT
// =========================

async function saveProduct(){

 const msg =
 document.getElementById("msg");

 try{

  msg.innerHTML =
  "⏳ Saving...";

  const token =
  localStorage.getItem("ak_token");

  if(!token){

   msg.innerHTML =
   `<span class="error">
   Please login first.
   </span>`;

   return;
  }

  const name =
  document
  .getElementById("productName")
  .value.trim();

  const cat =
  document
  .getElementById("category")
  .value;

  const price =
  Number(
   document
   .getElementById("price")
   .value
  );

  const description =
  document
  .getElementById("description")
  .value.trim();

  const file =
  document
  .getElementById("productPhoto")
  .files[0];

  if(!name){

   msg.innerHTML =
   `<span class="error">
   Product name डालो.
   </span>`;

   return;
  }

  if(!price){

   msg.innerHTML =
   `<span class="error">
   Price डालो.
   </span>`;

   return;
  }


  // =====================
  // EDIT PRODUCT
  // =====================

  if(editingId){

   let updateData = {
    name:name,
    cat:cat,
    price:price,
    description:description
   };

   if(file){

    msg.innerHTML =
    "📸 New photo upload ho rahi hai...";

    updateData.image_url =
    await uploadPhoto(file);

   }

   msg.innerHTML =
   "⏳ Product update ho raha hai...";

   const r =
   await fetch(
    SUPABASE_URL +
    "/rest/v1/products?id=eq." +
    editingId,
    {
     method:"PATCH",
     headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":
       "Bearer " + token,
      "Content-Type":
       "application/json",
      "Prefer":
       "return=minimal"
     },
     body:
     JSON.stringify(updateData)
    }
   );

   if(!r.ok){

    const error =
    await r.text();

    msg.innerHTML =
    `<span class="error">
    Update failed:<br>
    ${error}
    </span>`;

    return;
   }

   msg.innerHTML =
   `<span class="success">
   ✅ Product updated successfully!
   </span>`;

   cancelEdit();

   loadProducts();

   return;
  }


  // =====================
  // ADD NEW PRODUCT
  // =====================

  let imageUrl = "";

  if(file){

   msg.innerHTML =
   "📸 Photo upload ho rahi hai...";

   imageUrl =
   await uploadPhoto(file);

  }

  const product = {

   name:name,

   cat:cat,

   price:price,

   image_url:imageUrl,

   description:description,

   stock:true

  };

  msg.innerHTML =
  "⏳ Product save ho raha hai...";

  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/products",
   {
    method:"POST",
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":
      "Bearer " + token,
     "Content-Type":
      "application/json",
     "Prefer":
      "return=minimal"
    },
    body:
    JSON.stringify(product)
   }
  );

  if(!r.ok){

   const error =
   await r.text();

   msg.innerHTML =
   `<span class="error">
   Product add nahi hua:<br>
   ${error}
   </span>`;

   return;
  }

  msg.innerHTML =
  `<span class="success">
  ✅ Product added successfully!
  </span>`;

  clearForm();

  loadProducts();

 }catch(error){

  msg.innerHTML =
  `<span class="error">
  ❌ ${error.message}
  </span>`;

 }

}


// =========================
// LOAD PRODUCTS
// =========================

async function loadProducts(){

 const token =
 localStorage.getItem("ak_token");

 if(!token) return;

 try{

  const r =
  await fetch(
   SUPABASE_URL +
   "/rest/v1/products?select=*&order=id.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":
      "Bearer " + token
    }
   }
  );

  const data =
  await r.json();

  if(!r.ok){

   document
   .getElementById("productList")
   .innerHTML =
   `<p class="error">
   ${JSON.stringify(data)}
   </p>`;

   return;
  }

  if(!data.length){

   document
   .getElementById("productList")
   .innerHTML =
   "<p>No products added yet.</p>";

   return;
  }

  document
  .getElementById("productList")
  .innerHTML =

  data.map(p=>`

   <div class="product">

    ${
     p.image_url
     ?
     `<img
      src="${p.image_url}"
      alt="${p.name}"
     >`
     :
     ""
    }

    <h3>
     ${p.name || ""}
    </h3>

    <p>
     Category:
     ${p.cat || ""}
    </p>

    <p>
     Price:
     <b>₹${p.price || 0}</b>
    </p>

    <p>
     Stock:
     ${
      p.stock
      ?
      `<span class="in">Available ✅</span>`
      :
      `<span class="out">Out of Stock ❌</span>`
     }
    </p>

    ${
     p.description
     ?
     `<p>${p.description}</p>`
     :
     ""
    }

    <button
     class="editBtn"
     onclick="editProduct(${p.id})">
     ✏️ Edit
    </button>

    <button
     class="stockBtn"
     onclick="toggleStock(${p.id}, ${p.stock})">

     ${
      p.stock
      ?
      "📦 Mark Out of Stock"
      :
      "✅ Mark Available"
     }

    </button>

   </div>

  `).join("");

 }catch(error){

  document
  .getElementById("productList")
  .innerHTML =
  `<p class="error">
  ${error.message}
  </p>`;

 }

}


// =========================
// EDIT PRODUCT
// =========================

async function editProduct(id){

 const token =
 localStorage.getItem("ak_token");

 const r =
 await fetch(
  SUPABASE_URL +
  "/rest/v1/products?id=eq." +
  id +
  "&select=*",
  {
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":
     "Bearer " + token
   }
  }
 );

 const data =
 await r.json();

 if(!r.ok || !data.length){

  alert("Product load nahi hua.");

  return;
 }

 const p = data[0];

 editingId = id;

 document
 .getElementById("formTitle")
 .textContent =
 "✏️ Edit Product";

 document
 .getElementById("productName")
 .value =
 p.name || "";

 document
 .getElementById("category")
 .value =
 p.cat || "Plants";

 document
 .getElementById("price")
 .value =
 p.price || "";

 document
 .getElementById("description")
 .value =
 p.description || "";

 document
 .getElementById("productPhoto")
 .value = "";

 document
 .getElementById("saveBtn")
 .textContent =
 "💾 Update Product";

 document
 .getElementById("cancelBtn")
 .classList
 .remove("hidden");

 const preview =
 document
 .getElementById("photoPreview");

 if(p.image_url){

  preview.src =
  p.image_url;

  preview.style.display =
  "block";

 }else{

  preview.style.display =
  "none";

 }

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


// =========================
// STOCK ON/OFF
// =========================

async function toggleStock(id,currentStock){

 const token =
 localStorage.getItem("ak_token");

 const r =
 await fetch(
  SUPABASE_URL +
  "/rest/v1/products?id=eq." +
  id,
  {
   method:"PATCH",
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":
     "Bearer " + token,
    "Content-Type":
     "application/json",
    "Prefer":
     "return=minimal"
   },
   body:
   JSON.stringify({
    stock:!currentStock
   })
  }
 );

 if(r.ok){

  loadProducts();

 }else{

  const error =
  await r.text();

  alert(
   "Stock update nahi hua:\n" +
   error
  );

 }

}


// =========================
// CLEAR FORM
// =========================

function clearForm(){

 document
 .getElementById("productName")
 .value="";

 document
 .getElementById("price")
 .value="";

 document
 .getElementById("oldPrice")
 .value="";

 document
 .getElementById("productPhoto")
 .value="";

 document
 .getElementById("description")
 .value="";

 document
 .getElementById("photoPreview")
 .style.display="none";

}


// =========================
// CANCEL EDIT
// =========================

function cancelEdit(){

 editingId = null;

 document
 .getElementById("formTitle")
 .textContent =
 "➕ Add Product";

 document
 .getElementById("saveBtn")
 .textContent =
 "Add Product";

 document
 .getElementById("cancelBtn")
 .classList
 .add("hidden");

 clearForm();

}


// =========================
// LOGOUT
// =========================

function logout(){

 localStorage.removeItem(
  "ak_token"
 );

 location.reload();

}


// =========================
// AUTO LOGIN
// =========================

if(
 localStorage.getItem("ak_token")
){

 document
 .getElementById("loginBox")
 .classList
 .add("hidden");

 document
 .getElementById("adminBox")
 .classList
 .remove("hidden");

 loadProducts();

}

</script>

</body>
</html>
